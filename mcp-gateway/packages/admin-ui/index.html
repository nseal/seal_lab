<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP Gateway 管理画面</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --border: #d9dee5;
        --text: #1c2430;
        --muted: #5b6675;
        --accent: #2054c8;
        --danger: #b3261e;
        --ok: #1a7f37;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }
      main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { font-size: 20px; }
      h2 { font-size: 16px; margin-top: 32px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin: 12px 0;
      }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      .hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
      input[type="text"], input[type="password"], input[type="url"], select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 14px;
        background: #fff;
      }
      button {
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #fff;
        cursor: pointer;
        font-size: 14px;
        margin-right: 8px;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.danger { color: var(--danger); border-color: var(--danger); }
      button:disabled { opacity: 0.5; cursor: default; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; font-size: 12px; }
      .pill {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 12px;
        border: 1px solid var(--border);
      }
      .pill.ok { color: var(--ok); border-color: var(--ok); }
      .pill.off { color: var(--muted); }
      .pill.deny { color: var(--danger); border-color: var(--danger); }
      .error { color: var(--danger); margin: 8px 0; }
      .success { color: var(--ok); margin: 8px 0; }
      code.block {
        display: block;
        background: #f0f2f5;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        word-break: break-all;
        margin: 6px 0;
      }
      .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; margin-top: 8px; }
      .tool-grid label { display: flex; gap: 8px; align-items: baseline; font-weight: 400; margin: 2px 0; }
      .topbar { display: flex; justify-content: space-between; align-items: center; }
      a { color: var(--accent); cursor: pointer; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
