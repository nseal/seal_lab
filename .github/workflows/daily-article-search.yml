name: Daily Claude Article Search

on:
  schedule:
    # Runs every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Date to search for (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  search-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date_override }}" ]; then
            echo "target=${{ github.event.inputs.date_override }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run article search skill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TARGET_DATE="${{ steps.date.outputs.target }}"
          claude --print \
            "Today's date is ${TARGET_DATE}. Run /daily-claude-article-search to find and save today's top Claude and Anthropic articles to the article/ folder. After saving, stage and commit the new file with the message: 'article: add Claude digest for ${TARGET_DATE}'." \
            --allowedTools "WebSearch,Read,Write,Bash(git*)"

      - name: Push committed article file
        run: |
          git config user.name "claude-article-bot"
          git config user.email "noreply@anthropic.com"
          git push origin HEAD
