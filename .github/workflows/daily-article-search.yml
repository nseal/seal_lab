name: Daily Claude Article Search

on:
  schedule:
    # 08:00 JST = 23:00 UTC (previous day)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Date to search for (YYYY-MM-DD). Defaults to today in JST.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  search-and-save:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Resolve target date (JST)
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date_override }}" ]; then
            echo "value=${{ github.event.inputs.date_override }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Search and save articles
        env:
          DATE_OVERRIDE: ${{ steps.date.outputs.value }}
        run: python .github/scripts/fetch_claude_articles.py

      - name: Commit and push
        run: |
          git config user.name "claude-article-bot"
          git config user.email "noreply@anthropic.com"
          git add article/
          git diff --cached --quiet || git commit -m "article: add Claude digest for ${{ steps.date.outputs.value }}"
          git push origin HEAD
          # Email is sent by the Gmail MCP when the skill runs in a Claude Code session.
