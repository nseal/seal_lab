name: Daily Claude Article Search

on:
  schedule:
    # Runs every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Date to search for (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  search-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Search and save articles
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: python .github/scripts/fetch_claude_articles.py

      - name: Commit and push
        run: |
          git config user.name "claude-article-bot"
          git config user.email "noreply@anthropic.com"
          git add article/
          git diff --cached --quiet || git commit -m "article: add Claude digest for $(date -u +%Y-%m-%d)"
          git push origin HEAD
